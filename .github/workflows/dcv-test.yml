name: DCV Docker Test

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: ["22.04", "24.04"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run DCV test (Ubuntu ${{ matrix.ubuntu_version }})
        run: |
          bash ./tests/dcv-docker/test.sh "${{ matrix.ubuntu_version }}"